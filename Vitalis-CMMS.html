<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitalis CMMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --font-display:'Sora','IBM Plex Sans',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;

  /* cool slate neutrals biased toward teal */
  --bg:#eaeef2;
  --surface:#ffffff;
  --surface-2:#f5f8fa;
  --surface-3:#eef3f6;
  --text:#152230;
  --text-2:#54677a;
  --text-3:#8496a6;
  --border:#e1e8ee;
  --border-strong:#cdd8e1;

  /* brand — clinical teal */
  --primary:#0e8a80;
  --primary-600:#0c7a71;
  --primary-700:#0a655e;
  --primary-soft:#e2f2f0;
  --primary-ring:rgba(14,138,128,.28);

  /* fixed dark command rail (does not follow theme) */
  --rail:#0b1622;
  --rail-2:#0f1e2e;
  --rail-line:#1e3244;
  --rail-text:#c4d2df;
  --rail-text-2:#7c93a6;
  --rail-active:#12303a;

  /* semantic */
  --ok:#17925c;      --ok-soft:#e3f3ea;   --ok-line:#bfe3cf;
  --warn:#bd7710;    --warn-soft:#faeed6;  --warn-line:#efd7a6;
  --crit:#d24444;    --crit-soft:#fbe6e6;  --crit-line:#f2c4c4;
  --info:#2f6fed;    --info-soft:#e6eefc;  --info-line:#c3d6f8;
  --cal:#7a5af0;     --cal-soft:#ece7fc;   --cal-line:#d6ccf7;

  --shadow-sm:0 1px 2px rgba(16,32,48,.06),0 1px 3px rgba(16,32,48,.05);
  --shadow-md:0 2px 6px rgba(16,32,48,.07),0 8px 24px rgba(16,32,48,.08);
  --shadow-lg:0 8px 30px rgba(11,22,34,.16),0 2px 8px rgba(11,22,34,.10);
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080d13;
    --surface:#101a24;
    --surface-2:#0c141d;
    --surface-3:#16222e;
    --text:#e7eef4;
    --text-2:#9fb1c0;
    --text-3:#6c7f8f;
    --border:#213040;
    --border-strong:#2c3f52;
    --primary:#22b3a6;
    --primary-600:#1a9c90;
    --primary-700:#158577;
    --primary-soft:#0e2b2a;
    --primary-ring:rgba(34,179,166,.3);
    --ok:#3fbd82;   --ok-soft:#0e2a1f;   --ok-line:#1d4634;
    --warn:#e0a53f; --warn-soft:#2c2211;  --warn-line:#4a3a1a;
    --crit:#f0736f; --crit-soft:#2e1616;  --crit-line:#502626;
    --info:#5b93ff; --info-soft:#13203a;  --info-line:#263c63;
    --cal:#a992f7;  --cal-soft:#1e1836;   --cal-line:#352a5c;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#080d13; --surface:#101a24; --surface-2:#0c141d; --surface-3:#16222e;
  --text:#e7eef4; --text-2:#9fb1c0; --text-3:#6c7f8f;
  --border:#213040; --border-strong:#2c3f52;
  --primary:#22b3a6; --primary-600:#1a9c90; --primary-700:#158577;
  --primary-soft:#0e2b2a; --primary-ring:rgba(34,179,166,.3);
  --ok:#3fbd82; --ok-soft:#0e2a1f; --ok-line:#1d4634;
  --warn:#e0a53f; --warn-soft:#2c2211; --warn-line:#4a3a1a;
  --crit:#f0736f; --crit-soft:#2e1616; --crit-line:#502626;
  --info:#5b93ff; --info-soft:#13203a; --info-line:#263c63;
  --cal:#a992f7; --cal-soft:#1e1836; --cal-line:#352a5c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--primary-ring)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============ APP LAYOUT ============ */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}

/* ---- Command rail ---- */
.rail{
  background:linear-gradient(180deg,var(--rail-2),var(--rail));
  color:var(--rail-text);
  display:flex;flex-direction:column;
  border-right:1px solid var(--rail-line);
  overflow:hidden;
}
.brand{display:flex;align-items:center;gap:11px;padding:19px 20px 17px;border-bottom:1px solid var(--rail-line)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--primary),#0a655e);display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(14,138,128,.4)}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:#fff;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:10.5px;color:var(--rail-text-2);letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.rail-scroll{flex:1;overflow-y:auto;padding:12px 12px 20px}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rail-text-2);padding:0 12px 7px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;color:var(--rail-text);font-size:13.5px;font-weight:500;
  transition:background .13s,color .13s;position:relative;margin-bottom:1px;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.8}
.nav-item:hover{background:var(--rail-active);color:#fff}
.nav-item.active{background:var(--rail-active);color:#fff}
.nav-item.active svg{opacity:1;color:var(--primary)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--crit);color:#fff;border-radius:20px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 6px}
.nav-item .badge.amber{background:var(--warn)}
.nav-item .badge.muted{background:var(--rail-line);color:var(--rail-text)}
.rail-foot{padding:12px;border-top:1px solid var(--rail-line)}
.rail-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:background .13s}
.rail-user:hover{background:var(--rail-active)}
.avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2a4a5c,#183342);display:grid;place-items:center;font-weight:600;font-size:13px;color:#dbe8f0;flex-shrink:0}
.rail-user .who{line-height:1.25;overflow:hidden}
.rail-user .who b{color:#fff;font-weight:600;font-size:13px;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.rail-user .who span{color:var(--rail-text-2);font-size:11px}

/* ---- Main column ---- */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:60px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 22px;z-index:20;
}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0}
.crumbs b{color:var(--text);font-weight:600}
.crumbs svg{width:14px;height:14px;opacity:.5}
.search{
  margin-left:6px;flex:1;max-width:440px;display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:38px;
  transition:border .15s,box-shadow .15s;
}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.search svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
.search input{border:none;background:none;outline:none;flex:1;color:var(--text);font-size:13.5px}
.search input::placeholder{color:var(--text-3)}
.search kbd{font-family:var(--font-mono);font-size:11px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:background .13s,color .13s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;
  font-weight:600;font-size:13px;transition:background .13s,box-shadow .13s,transform .05s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(10,101,94,.35)}
.btn-primary:hover{background:var(--primary-600)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-3);border-color:var(--border-strong)}

/* ---- View canvas ---- */
.canvas{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.view{display:none;padding:24px 26px 60px;max-width:1480px;margin:0 auto;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
.page-head .sub{color:var(--text-2);font-size:13.5px;margin-top:4px}
.head-actions{display:flex;gap:9px;align-items:center}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card-head .hint{font-size:12px;color:var(--text-3)}
.link{color:var(--primary);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--primary-700);text-decoration:underline}
.link svg{width:13px;height:13px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;line-height:1.35}
.pill svg{width:12px;height:12px}
.pill .dotc{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.p-crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.p-info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.p-cal{background:var(--cal-soft);color:var(--cal);border-color:var(--cal-line)}
.p-muted{background:var(--surface-3);color:var(--text-2);border-color:var(--border)}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text-2);background:var(--surface);border:1px solid var(--border);transition:all .12s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-700);font-weight:600}
.chip .ct{font-family:var(--font-mono);font-size:11px;opacity:.7}
:root[data-theme="dark"] .chip.on,:root:not([data-theme="light"]) .chip.on{color:var(--primary)}

/* KPI tiles */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent,var(--primary));opacity:.9}
.kpi .kt{font-size:12px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.kpi .kt .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft,var(--primary-soft));color:var(--accent,var(--primary))}
.kpi .kt .ic svg{width:15px;height:15px}
.kpi .kv{font-family:var(--font-display);font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:12px;line-height:1;display:flex;align-items:baseline;gap:7px}
.kpi .kv small{font-size:14px;font-weight:600;color:var(--text-3)}
.kpi .kf{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:12px}
.kpi .trend{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.kpi .trend svg{width:13px;height:13px}
.trend.up{color:var(--ok)} .trend.down{color:var(--crit)} .trend.flat{color:var(--text-3)}
.kpi .kf .lbl{color:var(--text-3)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-dash{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

/* mini charts */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* bars list */
.barlist{display:flex;flex-direction:column;gap:13px}
.barlist .row{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:12px}
.barlist .row .nm{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barlist .row .track{height:9px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.barlist .row .fill{height:100%;border-radius:6px}
.barlist .row .vv{font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* alerts feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:13px 20px;border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:var(--surface-2)}
.feed-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.feed-ic svg{width:17px;height:17px}
.feed-body{flex:1;min-width:0}
.feed-body .ft{font-size:13px;font-weight:600;color:var(--text)}
.feed-body .fm{font-size:12.5px;color:var(--text-2);margin-top:2px}
.feed-body .fmeta{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl thead th{
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  font-weight:600;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);position:sticky;top:0
}
.tbl thead th.num,.tbl td.num{text-align:right}
.tbl tbody td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.tbl tbody tr{transition:background .1s;cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .id{font-family:var(--font-mono);font-size:12px;color:var(--text-2);font-weight:500}
.tbl .strong{font-weight:600;color:var(--text)}
.cellflex{display:flex;align-items:center;gap:10px}
.eq-ic{width:32px;height:32px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;flex-shrink:0;color:var(--text-2)}
.eq-ic svg{width:17px;height:17px}
.sub2{font-size:11.5px;color:var(--text-3);margin-top:1px}
.crit-stripe{display:inline-block;width:4px;height:26px;border-radius:3px;vertical-align:middle}

/* progress meter */
.meter{height:7px;background:var(--surface-3);border-radius:6px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:6px}
.meter-lbl{display:flex;align-items:center;gap:9px}
.meter-lbl .pct{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2);transition:all .12s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:500}
.spacer{flex:1}
.count-note{font-size:12.5px;color:var(--text-3)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(11,22,34,.5);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:40}
.scrim.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:var(--surface);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  z-index:41;display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.drawer-head .close{margin-left:auto}
.drawer-title{display:flex;align-items:center;gap:12px}
.drawer-title .big-ic{width:44px;height:44px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.drawer-title .big-ic svg{width:23px;height:23px}
.drawer-title h2{font-size:17px;font-weight:700}
.drawer-title .did{font-family:var(--font-mono);font-size:12px;color:var(--text-3);margin-top:3px}
.drawer-body{flex:1;overflow-y:auto;padding:0 0 30px}
.drawer-tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.drawer-tabs button{padding:12px 12px;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.drawer-tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.dsec{padding:20px 22px;border-bottom:1px solid var(--border)}
.dsec h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:13px;font-weight:600}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.kv-item .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.kv-item .v{font-size:13.5px;font-weight:500;color:var(--text)}
.kv-item .v.mono{font-size:12.5px}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:flex;gap:13px;padding-bottom:18px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-dot{width:28px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.tl-dot .d{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);box-shadow:0 0 0 2px var(--primary);z-index:1;margin-top:3px}
.tl-dot .ln{flex:1;width:2px;background:var(--border);margin-top:2px}
.tl-item:last-child .ln{display:none}
.tl-c .tl-t{font-size:13px;font-weight:600}
.tl-c .tl-m{font-size:12.5px;color:var(--text-2);margin-top:2px}
.tl-c .tl-time{font-size:11.5px;color:var(--text-3);margin-top:3px}
.doc-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.doc-row:last-child{border:none}
.doc-ic{width:34px;height:34px;border-radius:8px;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;flex-shrink:0}
.doc-ic.pdf{background:var(--crit-soft);color:var(--crit)}
.doc-ic.img{background:var(--info-soft);color:var(--info)}
.doc-ic svg{width:16px;height:16px}
.doc-row .dn{font-size:13px;font-weight:500;flex:1}
.doc-row .dm{font-size:11.5px;color:var(--text-3)}

/* health ring */
.hstat{display:flex;gap:16px;align-items:center}
.big-num{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}

/* workflow stepper */
.flow{display:flex;flex-direction:column;gap:0;margin-top:4px}
.flow-step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.flow-step:last-child{padding-bottom:0}
.flow-node{width:24px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.flow-node .fn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;z-index:1;font-size:12px;font-weight:700}
.flow-node .fn svg{width:14px;height:14px}
.flow-node .fl{flex:1;width:2px;margin-top:1px}
.flow-step:last-child .fl{display:none}
.flow-step.done .fn{background:var(--ok);color:#fff}
.flow-step.done .fl{background:var(--ok)}
.flow-step.current .fn{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-ring)}
.flow-step.current .fl{background:var(--border)}
.flow-step.todo .fn{background:var(--surface-3);color:var(--text-3);border:1.5px solid var(--border)}
.flow-step.todo .fl{background:var(--border)}
.flow-c{padding-top:1px}
.flow-c .fs-t{font-size:13px;font-weight:600}
.flow-c .fs-m{font-size:12px;color:var(--text-3);margin-top:1px}
.flow-step.current .fs-t{color:var(--primary-700)}
:root[data-theme="dark"] .flow-step.current .fs-t,:root:not([data-theme="light"]) .flow-step.current .fs-t{color:var(--primary)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-dow{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;text-align:center;padding-bottom:4px}
.cal-cell{min-height:92px;border:1px solid var(--border);border-radius:9px;padding:7px 8px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cal-cell .dnum{font-size:12px;font-weight:600;color:var(--text-2)}
.cal-cell.today .dnum{color:var(--primary)}
.cal-ev{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev.ok{background:var(--ok-soft);color:var(--ok)}
.cal-ev.warn{background:var(--warn-soft);color:var(--warn)}
.cal-ev.crit{background:var(--crit-soft);color:var(--crit)}
.cal-ev.cal{background:var(--cal-soft);color:var(--cal)}

/* stock bar */
.stockbar{display:flex;align-items:center;gap:9px;min-width:130px}
.stockbar .track{flex:1;height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden;position:relative}
.stockbar .track .rp{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-3);opacity:.6}
.stockbar .fill{height:100%;border-radius:5px}

.empty{padding:50px;text-align:center;color:var(--text-3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--rail);color:#fff;padding:12px 20px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;opacity:0;visibility:hidden;transition:all .28s;z-index:60}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast svg{width:18px;height:18px;color:var(--primary)}

/* ===== ADMIN: forms, roles, permissions, workflow ===== */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:11.5px;color:var(--text-3);font-weight:500}
.fld input,.fld select{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:13.5px;font-family:var(--font-ui);outline:none;transition:border .15s}
.fld input:focus,.fld select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.roles-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.role-list{display:flex;flex-direction:column;padding:6px;max-height:640px;overflow-y:auto}
.role-item{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:9px;transition:background .12s}
.role-item:hover{background:var(--surface-2)}
.role-item.on{background:var(--primary-soft)}
.ri-name{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-item.on .ri-name{color:var(--primary-700)}
.ri-desc{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-count{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-3);border-radius:20px;padding:2px 9px;flex-shrink:0}
:root[data-theme="dark"] .role-item.on .ri-name,:root:not([data-theme="light"]) .role-item.on .ri-name{color:var(--primary)}
.perm-tbl td,.perm-tbl th{padding:9px 14px}
.permcell{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface-2);display:inline-grid;place-items:center;transition:all .12s;color:#fff}
.permcell:hover{border-color:var(--primary)}
.permcell.on{background:var(--primary);border-color:var(--primary)}
.permcell svg{width:15px;height:15px}
.wf-rail{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.wf-node{display:inline-flex;align-items:center;height:34px;padding:0 15px;border-radius:9px;font-size:13px;font-weight:600;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text)}
.wf-node.start{border-color:var(--info);background:var(--info-soft);color:var(--info)}
.wf-node.end{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.wf-arrow{color:var(--text-3);display:inline-flex}
.wf-arrow svg{width:15px;height:15px}
.wf-tbl td{vertical-align:middle}
.wf-toggle{width:40px;height:23px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:background .15s;display:inline-block}
.wf-toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.wf-toggle.on{background:var(--primary);border-color:var(--primary)}
.wf-toggle.on .knob{transform:translateX(17px)}
@media (max-width:1180px){.roles-grid{grid-template-columns:1fr}}
/* ===== JOB WORKSPACE ===== */
.job-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.job-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.job-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-3);cursor:pointer;transition:color .12s}
.job-back:hover{color:var(--primary)}
.job-back svg{width:14px;height:14px;transform:rotate(180deg)}
.job-meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2);margin-top:8px;flex-wrap:wrap}
.job-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
.job-notes{width:100%;min-height:90px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:var(--font-ui);font-size:13px;color:var(--text);background:var(--surface-2);resize:vertical;outline:none;transition:border .15s}
.job-notes:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.job-notes::placeholder{color:var(--text-3)}
/* checklist */
.chk-progress{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:18px}
.chk-prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:13px}
.chk-prog-top b{font-weight:600}
.chk-warn{display:flex;gap:8px;align-items:flex-start;margin-top:11px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:9px 11px}
.chk-warn svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.chk-sec{margin-bottom:18px}
.chk-sec-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.chk-sec-n{font-family:var(--font-mono);letter-spacing:0;color:var(--primary);font-size:11px}
.chk-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--border)}
.chk-item:last-child{border-bottom:none}
.chk-t{font-size:13.5px;font-weight:500;color:var(--text)}
.chk-exp{font-size:11.5px;color:var(--text-3);font-weight:400;margin-top:2px}
.chk-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px;flex-shrink:0}
.chk-seg .cs{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-3);transition:all .12s}
.cs.pass.on{background:var(--ok);color:#fff}
.cs.fail.on{background:var(--crit);color:#fff}
.cs.na.on{background:var(--text-3);color:#fff}
.chk-read{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chk-read input{width:78px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:13px;text-align:right;padding:0 9px;outline:none}
.chk-read input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.chk-read .unit{font-size:12px;color:var(--text-3);min-width:34px;font-family:var(--font-mono)}
.chk-signoff{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:16px}
.chk-supr{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2);cursor:pointer}
.chk-supr input{width:16px;height:16px;accent-color:var(--primary)}
.btn:disabled{pointer-events:none}
@media (max-width:1180px){
  .job-grid{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .grid-dash,.grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .search{display:none}
}

/* ================= CHART HELPERS (inline SVG) ================= */
function donut(segs,size=132,thick=17,centerTop='',centerBot=''){
  const r=(size-thick)/2, c=size/2, circ=2*Math.PI*r;
  const total=segs.reduce((s,x)=>s+x.value,0)||1; let off=0;
  let arcs=segs.map(s=>{const len=s.value/total*circ;const dash=`${len} ${circ-len}`;const el=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;off+=len;return el}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thick}"/>${arcs}
    ${centerTop?`<text x="${c}" y="${c-2}" text-anchor="middle" font-family="Sora" font-weight="700" font-size="26" fill="var(--text)">${centerTop}</text>`:''}
    ${centerBot?`<text x="${c}" y="${c+16}" text-anchor="middle" font-family="IBM Plex Sans" font-size="10.5" fill="var(--text-3)" letter-spacing=".5">${centerBot}</text>`:''}
  </svg>`;
}
function areaChart(data,w=560,h=170,color='var(--primary)',fill='var(--primary)'){
  const pad={l:34,r:12,t:14,b:24}; const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.v))*1.12, min=Math.min(...data.map(d=>d.v))*.9;
  const X=i=>pad.l+i*(iw/(data.length-1)); const Y=v=>pad.t+ih-((v-min)/(max-min))*ih;
  const line=data.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d.v).toFixed(1)}`).join(' ');
  const area=`${line} L${X(data.length-1)} ${pad.t+ih} L${pad.l} ${pad.t+ih} Z`;
  const grid=[0,.25,.5,.75,1].map(g=>{const y=pad.t+ih-g*ih;return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1" ${g?'stroke-dasharray="3 4"':''}/>`}).join('');
  const gid='ag'+Math.random().toString(36).slice(2,7);
  const labels=data.map((d,i)=>i%2===0?`<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--text-3)">${d.l}</text>`:'').join('');
  const yl=[min,(min+max)/2,max].map(v=>{const y=Y(v);return `<text x="${pad.l-8}" y="${y+3}" text-anchor="end" font-size="9.5" fill="var(--text-3)">${Math.round(v)}</text>`}).join('');
  const dot=`<circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1].v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".22"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${yl}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dot}${labels}
  </svg>`;
}
function barChart(data,w=560,h=170){
  const pad={l:30,r:10,t:14,b:24}; const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.a+d.b))*1.15;
  const bw=iw/data.length*.5; const step=iw/data.length;
  const Y=v=>pad.t+ih-(v/max)*ih;
  const grid=[0,.5,1].map(g=>{const y=pad.t+ih-g*ih;return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1" ${g?'stroke-dasharray="3 4"':''}/>`}).join('');
  const bars=data.map((d,i)=>{const x=pad.l+i*step+step/2-bw/2;const ha=(d.a/max)*ih,hb=(d.b/max)*ih;
    return `<rect x="${x}" y="${pad.t+ih-ha}" width="${bw}" height="${ha}" rx="2.5" fill="var(--primary)"/>
    <rect x="${x}" y="${pad.t+ih-ha-hb}" width="${bw}" height="${hb}" rx="2.5" fill="var(--warn)" opacity=".9"/>
    <text x="${x+bw/2}" y="${h-7}" text-anchor="middle" font-size="10" fill="var(--text-3)">${d.l}</text>`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${grid}${bars}</svg>`;
}
function spark(vals,w=90,h=28,color='var(--primary)'){
  const max=Math.max(...vals),min=Math.min(...vals);const X=i=>i*(w/(vals.length-1));const Y=v=>h-2-((v-min)/((max-min)||1))*(h-4);
  const p=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px"><path d="${p}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* --- checklist item builders --- */
const chk=t=>({t,type:'check'});
const rd=(t,unit,nominal,min,max)=>({t,type:'reading',unit,nominal,min,max});
const ELEC={title:'Electrical Safety — IEC 62353',items:[rd('Protective earth resistance','Ω',0.08,0,0.2),rd('Equipment leakage current','mA',0.12,0,0.5),rd('Touch / enclosure leakage','µA',48,0,100)]};

const CHECKLISTS={
  generic:{sections:[VISUAL,ELEC,{title:'Functional Test',items:[chk('Power-on self-test passes'),chk('Alarms audible & visible'),chk('Battery backup operational'),chk('Controls & display operate correctly')]}]},
  ventilator:{sections:[VISUAL,{title:'Functional Performance',items:[rd('Delivered tidal volume','mL',500,450,550),rd('Airway pressure','cmH₂O',20,18,22),rd('FiO₂ accuracy','%',21,19,23),rd('Respiratory rate','bpm',12,11,13),chk('Apnoea & disconnect alarms operate'),chk('O₂ cell calibrated')]},ELEC]},
  defib:{sections:[VISUAL,{title:'Energy & Function',items:[rd('Delivered energy @ 200 J','J',200,190,210),rd('Charge time to 200 J','s',7,0,10),chk('ECG display accurate & clear'),chk('Pacing function operational'),chk('Battery fully charged & holds'),chk('Self-test log reviewed')]},ELEC]},
  anesthesia:{sections:[VISUAL,{title:'Gas & Function',items:[rd('O₂ concentration delivered','%',100,95,100),rd('Vaporizer output','%',2,1.8,2.2),chk('Circuit leak < 200 mL/min'),chk('Scavenging system functional'),chk('O₂ failure alarm operates'),chk('Ventilator mode functional')]},ELEC]},
  imaging:{sections:[VISUAL,{title:'Performance & Radiation Safety',items:[chk('Image-quality phantom test passes'),rd('kVp accuracy','kVp',80,76,84),rd('Radiation output','mGy',5,4.5,5.5),chk('Emergency stop functional'),chk('Interlocks & warning lights operational')]},ELEC]},
  posttest:{sections:[{title:'Post-Repair Verification',items:[chk('Repair action verified effective'),chk('Functional test passes'),rd('Electrical safety — earth leakage','mA',0.12,0,0.5),chk('Performance within specification'),chk('Equipment cleaned & ready for service')]}]},
};
function tplTotal(tpl){return tpl.sections.reduce((s,x)=>s+x.items.length,0)}
function progressOf(id,tplKey){const tpl=CHECKLISTS[tplKey];const st=jobState(id);let done=0,fails=0;tpl.sections.forEach((sec,si)=>sec.items.forEach((it,ii)=>{const r=st.checklist[si+'-'+ii];if(r&&r.result){done++;if(r.result==='fail')fails++}}));return{done,fails,total:tplTotal(tpl)}}

/* --- checklist interactions --- */
function setCheck(id,key,val){jobState(id).checklist[key]={result:val};refreshChecklist(id)}
function setReading(id,key,val,min,max){const st=jobState(id);if(val===''){delete st.checklist[key]}else{const num=parseFloat(val);const pass=num>=min&&num<=max;st.checklist[key]={result:pass?'pass':'fail',val:num}}refreshChecklist(id)}
let CHK_CTX=null;
function refreshChecklist(id){if(!CHK_CTX)return;const el=document.getElementById('chkarea');if(el)el.innerHTML=checklistHTML(id,CHK_CTX.tpl,CHK_CTX.mode)}
function checklistHTML(id,tplKey,mode){
  const tpl=CHECKLISTS[tplKey];const st=jobState(id);const pr=progressOf(id,tplKey);const pct=Math.round(pr.done/pr.total*100);
  const secs=tpl.sections.map((sec,si)=>`
    <div class="chk-sec">
      <div class="chk-sec-h">${sec.title}<span class="chk-sec-n">${sec.items.filter((it,ii)=>st.checklist[si+'-'+ii]?.result).length}/${sec.items.length}</span></div>
      ${sec.items.map((it,ii)=>{const key=si+'-'+ii;const r=st.checklist[key];
        if(it.type==='check'){return `<div class="chk-item"><div class="chk-t">${it.t}</div>
          <div class="chk-seg">
            <button class="cs pass ${r?.result==='pass'?'on':''}" onclick="setCheck('${id}','${key}','pass')">Pass</button>
            <button class="cs fail ${r?.result==='fail'?'on':''}" onclick="setCheck('${id}','${key}','fail')">Fail</button>
            <button class="cs na ${r?.result==='na'?'on':''}" onclick="setCheck('${id}','${key}','na')">N/A</button>
          </div></div>`}
        else{const badge=r?.result==='pass'?'<span class="pill p-ok">Pass</span>':r?.result==='fail'?'<span class="pill p-crit">Out of range</span>':'';
          return `<div class="chk-item reading"><div class="chk-t">${it.t}<div class="chk-exp">Expected ${it.nominal} ${it.unit} · range ${it.min}–${it.max}</div></div>
          <div class="chk-read"><input type="number" step="any" value="${r?.val??''}" placeholder="—" onchange="setReading('${id}','${key}',this.value,${it.min},${it.max})"><span class="unit">${it.unit}</span>${badge}</div></div>`}
      }).join('')}
    </div>`).join('');
  const canClose=pr.done===pr.total;
  const actionLabel=mode==='pm'?'Complete PM & Schedule Next':'Complete Testing & Verify';
  const action=mode==='pm'?`completePM('${id}')`:`completeTesting('${id}')`;
  return `
    <div class="chk-progress">
      <div class="chk-prog-top"><b>Checklist completion</b><span class="mono">${pr.done}/${pr.total} · ${pct}%</span></div>
      <div class="meter" style="height:9px"><i style="width:${pct}%;background:${pr.fails?'var(--warn)':'var(--primary)'}"></i></div>
      ${pr.fails?`<div class="chk-warn">${icon('alert')} ${pr.fails} reading(s) out of range — corrective action or supervisor review required before return to service.</div>`:''}
    </div>
    ${secs}
    <div class="chk-signoff">
      <div class="chk-sec-h">Sign-off</div>
      <label class="chk-supr"><input type="checkbox" ${st.supervisor?'checked':''} onchange="jobState('${id}').supervisor=this.checked"> Supervisor verification obtained (required for life-support equipment)</label>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">
        <button class="btn ${canClose?'btn-primary':'btn-ghost'}" onclick="${action}" ${canClose?'':'disabled style=\"opacity:.55;cursor:not-allowed\"'}>${icon('check')}${actionLabel}</button>
        <button class="btn btn-ghost" onclick="toast('Draft saved')">Save Draft</button>
      </div>
      ${!canClose?`<div class="sub2" style="margin-top:8px">Complete all ${pr.total} checklist items to enable sign-off.</div>`:''}
    </div>`;
}
function addInterval(d,freq){const dt=new Date(d);const m={Quarterly:3,'Semi-annual':6,Annual:12,Monthly:1,Weekly:0}[freq]??3;dt.setMonth(dt.getMonth()+m);return dt.toISOString().slice(0,10)}
function completePM(id){const pm=PMWOMAP[id];const pr=progressOf(id,pm.tpl);if(pr.done<pr.total){toast('Complete all checklist items first');return;}
  const e=EQMAP[pm.eq];pm.status='completed';pm.completedOn=TODAY;e.pm=Math.min(100,Math.max(e.pm,pr.fails?88:98));e.nextPM=addInterval(pm.due,pm.freq);if(e.status==='pm'||e.status==='maint')e.status='available';
  toast('PM '+id+' completed — next '+pm.freq.toLowerCase()+' PM scheduled '+fmtDate(e.nextPM));openJob(id,'pm')}
function completeTesting(id){const st=jobState(id);const pr=progressOf(id,'posttest');if(pr.done<pr.total){toast('Complete all verification items');return;}
  if(pr.fails){toast('Testing failed — equipment cannot return to service');return;}st.step=6;toast('Post-repair testing passed — ready for verification');openJob(id,'wo')}

}

const MODULES=['Equipment','Work Orders','Preventive PM','Calibration','Spare Parts','Vendors','Reports','Configuration','Users & Roles'];
const ACTIONS=['View','Create','Edit','Approve','Delete'];
const PERMS={};
function seedPerms(){
  ROLES.forEach(r=>{const m={};MODULES.forEach(mod=>m[mod]={View:false,Create:false,Edit:false,Approve:false,Delete:false});
    const g=(mod,acts)=>acts.forEach(a=>m[mod][a]=true);const all=v=>MODULES.forEach(mod=>ACTIONS.forEach(a=>m[mod][a]=v));
    switch(r.id){
      case'sysadmin':all(true);break;
      case'cmmsadmin':MODULES.forEach(mod=>g(mod,['View','Create','Edit']));g('Configuration',['Approve']);g('Work Orders',['Approve']);g('Preventive PM',['Approve']);break;
      case'biomanager':MODULES.forEach(mod=>g(mod,['View']));['Work Orders','Preventive PM','Calibration'].forEach(mod=>g(mod,['Create','Edit','Approve']));g('Vendors',['Approve']);g('Reports',['Create']);break;
      case'bioeng':['Equipment','Work Orders','Preventive PM','Calibration','Spare Parts','Reports'].forEach(mod=>g(mod,['View']));['Work Orders','Preventive PM','Calibration'].forEach(mod=>g(mod,['Create','Edit']));g('Spare Parts',['Create']);break;
      case'biotech':case'facil':['Equipment','Work Orders','Preventive PM','Spare Parts'].forEach(mod=>g(mod,['View']));g('Work Orders',['Edit']);g('Preventive PM',['Edit']);g('Spare Parts',['Create']);break;
      case'requester':g('Equipment',['View']);g('Work Orders',['View','Create']);break;
      case'deptmgr':g('Equipment',['View']);g('Work Orders',['View','Create','Approve']);g('Reports',['View']);break;
      case'store':g('Spare Parts',['View','Create','Edit']);g('Work Orders',['View']);g('Reports',['View']);break;
      case'procure':g('Spare Parts',['View','Create']);g('Vendors',['View','Create','Edit']);g('Reports',['View']);break;
      case'finance':['Equipment','Work Orders','Reports'].forEach(mod=>g(mod,['View']));g('Reports',['Create']);break;
      case'quality':['Equipment','Work Orders','Preventive PM','Calibration','Reports'].forEach(mod=>g(mod,['View']));g('Reports',['Create']);break;
      case'vendor':g('Work Orders',['View','Edit']);break;
      default:MODULES.forEach(mod=>g(mod,['View']));
    }
    PERMS[r.id]=m;
  });
}

    <thead><tr><th>From</th><th>Action</th><th>Next</th><th>Required Conditions</th><th class="num">Approval</th><th class="num">Notify</th><th>SLA Effect</th></tr></thead>
    <tbody>${wf.transitions.map((t,i)=>`<tr>
      <td><span class="pill p-muted">${t.from}</span></td>
      <td class="strong">${t.action}</td>
      <td><span class="pill p-info">${t.to}</span></td>
      <td><div style="display:flex;flex-wrap:wrap;gap:5px">${t.cond.length?t.cond.map(c=>`<span class="pill p-muted" style="padding:2px 7px">${c}</span>`).join(''):'<span class="sub2">None</span>'}</div></td>
      <td class="num"><button class="wf-toggle ${t.approval?'on':''}" onclick="toggleWF('${wf.id}',${i},'approval')"><span class="knob"></span></button></td>
      <td class="num"><button class="wf-toggle ${t.notify?'on':''}" onclick="toggleWF('${wf.id}',${i},'notify')"><span class="knob"></span></button></td>
      <td class="sub2" style="margin:0">${t.sla}</td>
    </tr>`).join('')}</tbody>
  </table></div>
  <div class="card-pad" style="border-top:1px solid var(--border);display:flex;gap:9px"><button class="btn btn-ghost" onclick="toast('Add transition — from/action/to editor')">${icon('dash')}Add Transition</button><button class="btn btn-primary" onclick="toast('${wf.name} workflow published')">${icon('check')}Publish Workflow</button></div>
  </div>`;
};
function toggleWF(wid,i,field){const wf=WORKFLOWS.find(w=>w.id===wid);wf.transitions[i][field]=!wf.transitions[i][field];go('workflows');toast(field==='approval'?(wf.transitions[i].approval?'Approval now required':'Approval removed'):(wf.transitions[i].notify?'Notification enabled':'Notification disabled'))}
function addState(){const el=document.getElementById('newstate');const nm=el&&el.value.trim();if(!nm){toast('Enter a status name');return;}const wf=WORKFLOWS.find(w=>w.id===SELWF);wf.states.splice(wf.states.length-1,0,nm);go('workflows');toast('State "'+nm+'" added')}

/* ================= INIT ================= */
(function init(){
  seedPerms();
  try{const t=localStorage.getItem('vit-theme');if(t){THEME=t}}catch(e){}
  if(THEME==='dark')setTheme('dark');else setTheme('light');
  buildNav();
  go('dashboard');
  document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;const hit=EQUIP.find(x=>(x.name+x.tag+x.id).toLowerCase().includes(q.toLowerCase()));if(hit){openEquipment(hit.id)}else{toast('No results for "'+q+'"')}}});
})();
</script>
</body>
</html>
